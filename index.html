<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Clicker</title>
  <script>
    // Pick the theme before the page is drawn, so it never flashes the wrong colors.
    (function () {
      var theme;
      try {
        theme = localStorage.getItem("coinClicker.theme");
      } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <!-- "?v=" makes browsers download fresh files after an update instead of using old saved copies.
       Raise the number (here and on script.js at the bottom) whenever style.css or script.js changes. -->
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <div class="toolbar">
    <button id="sound-toggle" class="toolbar-button icon-button sound-toggle" type="button" data-sound="on" aria-label="Turn sound off">
      <svg class="icon-sound-on" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/>
        <path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <svg class="icon-sound-off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/>
        <path d="M15.5 9.5l5 5M20.5 9.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <button id="theme-toggle" class="toolbar-button icon-button" type="button" aria-label="Switch theme">
      <!-- Shows the theme you will switch to: moon in light mode, sun in dark mode. -->
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" fill="currentColor"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
        <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <nav class="language-switcher" aria-label="Language">
      <button class="toolbar-button language-option" type="button" data-lang="en">EN</button>
      <button class="toolbar-button language-option" type="button" data-lang="ru">RU</button>
    </nav>
  </div>

  <main class="game">
    <h1 data-i18n="title">Coin Clicker</h1>

    <p class="score">
      <span data-i18n="score">Score:</span> <span id="score">0</span>
      <span id="multiplier" class="multiplier" hidden></span>
    </p>

    <div class="progress">
      <p id="progress-text" class="progress-text"></p>
      <!-- script.js adds one segment per goal. -->
      <div id="progress-track" class="progress-track" role="progressbar" aria-labelledby="progress-text"></div>
    </div>

    <!-- The stage reserves room for the coin at full size, so nothing jumps around as it grows. -->
    <div class="coin-stage">
      <button id="coin" class="coin" type="button" data-i18n-aria-label="coinLabel" aria-label="Click the coin">
        <span class="coin-face">$</span>
      </button>
    </div>

    <button id="reset" class="reset" type="button" data-i18n="reset">Reset</button>
  </main>

  <!-- Opens when the final goal is reached. script.js fills in the text. -->
  <dialog id="victory" class="victory" aria-labelledby="victory-title" aria-describedby="victory-text">
    <!-- Only the final ending shows this line ("The end"). -->
    <p id="victory-kicker" class="victory-kicker" hidden></p>
    <div id="victory-icon" class="victory-icon" aria-hidden="true"></div>
    <h2 id="victory-title" class="victory-title"></h2>
    <p id="victory-text" class="victory-text"></p>
    <span id="victory-bonus" class="milestone-bonus"></span>
    <div class="victory-actions">
      <button id="victory-close" class="victory-button" type="button"></button>
    </div>
  </dialog>

  <!-- Asks before the Reset button wipes the player's progress. -->
  <dialog id="reset-dialog" class="confirm-dialog" aria-labelledby="reset-dialog-title" aria-describedby="reset-dialog-text">
    <h2 id="reset-dialog-title" class="confirm-title" data-i18n="resetTitle">Reset your progress?</h2>
    <p id="reset-dialog-text" class="confirm-text" data-i18n="resetText">Your score, bonus and all goals will go back to 0. This can't be undone.</p>
    <div class="confirm-actions">
      <!-- autofocus: Cancel is the safe default if Enter is pressed by accident. -->
      <button id="reset-cancel" class="confirm-cancel" type="button" data-i18n="resetCancel" autofocus>Cancel</button>
      <button id="reset-confirm" class="confirm-reset" type="button" data-i18n="resetConfirm">Reset</button>
    </div>
  </dialog>

  <!-- Shown when clicking stays impossibly fast for too long (most likely an auto-clicker). -->
  <dialog id="rest-dialog" class="rest-dialog" aria-labelledby="rest-title" aria-describedby="rest-text">
    <div id="rest-card" class="rest-card">
      <div class="rest-icon" aria-hidden="true">🥵</div>
      <h2 id="rest-title" class="rest-title" data-i18n="restTitle">Slow down, speed demon!</h2>
      <p id="rest-text" class="rest-text"></p>
    </div>
    <!-- script.js moves this button away from where the clicks were landing. -->
    <button id="rest-button" class="rest-button" type="button" data-i18n="restButton">I'm rested 😌</button>
  </dialog>

  <!-- Goal celebration messages appear here; screen readers announce them. -->
  <div id="milestone-layer" class="milestone-layer" role="status" aria-live="polite"></div>

  <script src="script.js?v=9"></script>
</body>
</html>
